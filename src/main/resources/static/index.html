<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebSocket Event Tester</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --border: #d9e1ec;
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --text: #1f2937;
        --muted: #6b7280;
        --error: #dc2626;
        --success: #15803d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 900px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.05);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 180px;
        resize: vertical;
        padding: 12px;
        font-size: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #f8fafc;
        color: var(--text);
      }

      .actions {
        margin-top: 16px;
      }

      button {
        cursor: pointer;
        border: none;
        background: var(--primary);
        color: white;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--primary-hover);
      }

      .status {
        margin-top: 12px;
        font-size: 14px;
        color: var(--muted);
        min-height: 20px;
      }

      .status.error {
        color: var(--error);
      }

      .status.success {
        color: var(--success);
      }

      .display-window {
        margin-top: 20px;
        background: #111827;
        color: #e5e7eb;
        border-radius: 10px;
        padding: 16px;
        min-height: 220px;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 13px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">
        <h1>WebSocket Event Tester</h1>

        <label for="messageInput">Event JSON</label>
        <textarea id="messageInput" spellcheck="false">{
  "type": "VOTE"
}</textarea>

        <div class="actions">
          <button id="sendBtn" type="button">Send Message</button>
        </div>

        <div id="status" class="status">Disconnected</div>

        <h2>Server Response</h2>
        <div id="displayWindow" class="display-window">No JSON message received yet.</div>
      </div>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
